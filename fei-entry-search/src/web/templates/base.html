<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FEI Low Entry Search{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('main.static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">FEI Entry Search</div>
        <div class="nav-links">
            <a href="{{ url_for('main.dashboard') }}" class="{% if request.endpoint == 'main.dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('main.calendar') }}" class="{% if request.endpoint == 'main.calendar' %}active{% endif %}">Calendar</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('main.static', filename='app.js') }}"></script>
</body>
</html>

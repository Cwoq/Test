[project]
name = "fei-entry-search"
version = "0.1.0"
description = "Find FEI jumping shows in North America with historically low entry numbers"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "playwright>=1.40",
    "pandas>=2.0",
    "jinja2>=3.1",
]

[project.scripts]
scrape-fei = "scripts.scrape_fei:main"
scrape-showgrounds = "scripts.scrape_showgrounds:main"
fei-dashboard = "src.web.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
